name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release Tag format is Semver, input "vX.Y.Z"
        required: true
        type: string
      
jobs:
  build:
    if: ${{ github.event.inputs.tag }} =~ ^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - name: Build Go
        shell: pwsh
        run: |
          New-Item -Path "build" -Item Directory
          Copy-Item "LICENSE" -Destination "build\LICENSE"
          go install github.com/google/go-licenses@latest
          go-licenses save ./... --force --save_path build/licenses
          go build -o ./build/ProcessTuner.exe -ldflags "-s -w -X=github.com/ryo-kagawa/WallpaperChanger/subcommand.name=ProcessTuner.exe -X=github.com/ryo-kagawa/ProcessTuner/subcommand.version=${{ github.event.inputs.tag }}" -trimpath ./cmd/main
          go build -o ./build/ProcessTuner-Settings.exe -ldflags "-s -w -X=github.com/ryo-kagawa/WallpaperChanger/subcommand.name=ProcessTuner-Settings.exe -X=github.com/ryo-kagawa/ProcessTuner/subcommand.version=${{ github.event.inputs.tag }}" -trimpath ./cmd/settings
          Compress-Archive -Path build\* -Destination ProcessTuner_${{ github.event.inputs.tag }}.zip
        env:
          GOAMD64: v3
      - name: GitHub Release
        run: |
          gh release create ${{ github.event.inputs.tag }} ProcessTuner_${{ github.event.inputs.tag }}.zip --generate-notes --title ${{ github.event.inputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
